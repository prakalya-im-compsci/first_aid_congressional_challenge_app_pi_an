<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Python First-Aid Assistant</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #fff5f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-emergency { background: #d9534f; color: white; border: none; padding: 16px; width: 100%; border-radius: 8px; font-size: 1.25rem; font-weight: bold; cursor: pointer; margin-bottom: 20px; text-align: center; display: block; text-decoration: none;}
        .btn-action { background: #0275d8; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .output-box { background: #fdfdfe; border: 1px solid #e3e6f0; border-left: 5px solid #0275d8; padding: 15px; margin: 15px 0; border-radius: 4px; font-size: 1.1rem; line-height: 1.5; }
        pre.ascii-art { background: #272822; color: #a6e22e; padding: 10px; border-radius: 6px; overflow-x: auto; font-family: monospace; font-size: 0.9rem; text-align: left; }
        textarea { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    </style>
</head>
<body>

<div class="container">
    <!-- Always available emergency call button -->
    <a href="tel:911" class="btn-emergency">🚨 CALL 911 (OR LOCAL EMERGENCY)</a>

    <!-- Input screen -->
    <div id="screen-home">
        <h2>What is the emergency?</h2>
        <textarea id="user-situation" rows="3" placeholder="e.g., Severe bleeding on arm..."></textarea>
        <button class="btn-action" onclick="startSession()">Begin Protocol</button>
    </div>

    <!-- Active Guidance screen -->
    <div id="screen-guide" style="display:none;">
        <pre class="ascii-art" id="ascii-output">[+] Loading...</pre>
        <div class="output-box" id="instruction-text">Connecting...</div>

        <button class="btn-action" style="background-color: #5cb85c;" onclick="sendFeedback('Done. What is next?')">✅ Done / Next Step</button>
        <button class="btn-action" style="background-color: #f0ad4e;" onclick="sendFeedback('I cannot do this or missing supply. Give alternative.')">⚠️ Missing Supply / Can't Do This</button>
        <button class="btn-action" style="background-color: #d9534f; margin-top:15px;" onclick="location.reload()">🔄 Start Over</button>
    </div>
</div>

<script>
    async function sendFeedback(messageText) {
        document.getElementById('instruction-text').innerText = "Processing safe step...";
        
        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: messageText })
            });
            const data = await response.json();
            parseResponse(data.response);
        } catch (err) {
            document.getElementById('instruction-text').innerText = "Error communicating with secure backend.";
        }
    }

    function startSession() {
        const situation = document.getElementById('user-situation').value.trim();
        if(!situation) return alert("Please enter the emergency.");
        
        document.getElementById('screen-home').style.display = 'none';
        document.getElementById('screen-guide').style.display = 'block';
        sendFeedback(`Emergency situation: ${situation}. Give me Step 1.`);
    }

    function parseResponse(rawText) {
        if (rawText.includes("---ASCII---")) {
            const parts = rawText.split("---ASCII---");
            document.getElementById('ascii-output').innerText = parts[1] ? parts[1].trim() : "[+]";
            document.getElementById('instruction-text').innerText = parts[2] ? parts[2].trim() : parts[0].trim();
        } else {
            document.getElementById('ascii-output').innerText = "[+ First Aid +]";
            document.getElementById('instruction-text').innerText = rawText;
        }
    }
</script>
</body>
</html>
